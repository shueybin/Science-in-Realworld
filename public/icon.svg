<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="atomGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle for Android -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle tech ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="8 12" opacity="0.6" />

  <!-- Orbit Ellipses -->
  <g transform="translate(256 256)">
    <!-- Orbit 1 (45 deg) -->
    <ellipse rx="170" ry="60" transform="rotate(45)" fill="none" stroke="url(#orbitGrad)" stroke-width="7" opacity="0.85" />
    <!-- Electron 1 -->
    <circle cx="120" cy="42" r="11" fill="#38bdf8" filter="url(#glow)" />

    <!-- Orbit 2 (-45 deg) -->
    <ellipse rx="170" ry="60" transform="rotate(-45)" fill="none" stroke="url(#orbitGrad)" stroke-width="7" opacity="0.85" />
    <!-- Electron 2 -->
    <circle cx="-120" cy="42" r="11" fill="#a855f7" filter="url(#glow)" />

    <!-- Orbit 3 (Horizontal) -->
    <ellipse rx="170" ry="60" fill="none" stroke="#2dd4bf" stroke-width="7" opacity="0.85" />
    <!-- Electron 3 -->
    <circle cx="0" cy="-60" r="11" fill="#34d399" filter="url(#glow)" />

    <!-- Glowing Atomic Nucleus -->
    <circle cx="0" cy="0" r="42" fill="url(#atomGlow)" filter="url(#glow)" />
    <!-- Nucleus Protons / Neutrons Cluster detail -->
    <circle cx="-10" cy="-10" r="18" fill="#f43f5e" opacity="0.9" />
    <circle cx="10" cy="-8" r="17" fill="#fbbf24" opacity="0.9" />
    <circle cx="0" cy="12" r="17" fill="#3b82f6" opacity="0.9" />
    <circle cx="0" cy="0" r="12" fill="#ffffff" opacity="0.75" />
  </g>

  <!-- Bottom Badge: Beaker / Realworld Molecule -->
  <g transform="translate(256, 440)">
    <rect x="-80" y="-20" width="160" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="0" y="2" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" letter-spacing="1.5">REALWORLD</text>
  </g>
</svg>
